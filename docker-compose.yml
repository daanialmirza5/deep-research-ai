name: deep-research-ai

x-backend-env: &backend-env
  env_file:
    - .env

networks:
  dra-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
  prometheus-data:
  grafana-data:
  ollama-data:

services:
  # --------------------------------------------------------------------------
  # Data layer
  # --------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_EXPOSED_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [dra-network]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_EXPOSED_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [dra-network]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [dra-network]

  # --------------------------------------------------------------------------
  # Application layer
  # --------------------------------------------------------------------------
  backend:
    <<: *backend-env
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/srv/backend
      - ./ai:/srv/ai
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks: [dra-network]

  worker:
    <<: *backend-env
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info
    volumes:
      - ./backend:/srv/backend
      - ./ai:/srv/ai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      backend:
        # Not a functional dependency (the worker never calls the API) — just
        # sequences container startup so the worker isn't racing the backend
        # for first-boot resources. Migrations are a separate, explicit step
        # (`make migrate`, see docs/deployment.md) run once both are up, not
        # gated on this.
        condition: service_healthy
    networks: [dra-network]

  beat:
    <<: *backend-env
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat --loglevel=info
    volumes:
      - ./backend:/srv/backend
      - ./ai:/srv/ai
    depends_on:
      redis:
        condition: service_healthy
    networks: [dra-network]

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
      target: dev   # docker-compose.prod.yml overrides this to `runner`
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # alpine's busybox ships wget but not curl (unlike the Python images
      # above, which install curl explicitly) — no extra package needed.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    networks: [dra-network]

  # --------------------------------------------------------------------------
  # Edge
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks: [dra-network]

  # --------------------------------------------------------------------------
  # Observability
  # --------------------------------------------------------------------------
  # Sidecar exporters: neither the Celery workers nor Postgres speak
  # Prometheus's exposition format natively, so each gets a small dedicated
  # exporter process rather than the app trying to serve /metrics for them
  # itself (see docker/prometheus/prometheus.yml's scrape_configs, which
  # target these two services by name).
  celery-exporter:
    image: danihodovic/celery-exporter:latest
    restart: unless-stopped
    command: ["--broker-url", "${CELERY_BROKER_URL}"]
    depends_on:
      redis:
        condition: service_healthy
    networks: [dra-network]

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: "postgres:5432/${POSTGRES_DB}?sslmode=disable"
      DATA_SOURCE_USER: ${POSTGRES_USER}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [dra-network]

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - celery-exporter
      - postgres-exporter
    networks: [dra-network]

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
    networks: [dra-network]

  # --------------------------------------------------------------------------
  # Optional: fully local LLM runtime (opt-in via `--profile local-ai`)
  # --------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: ["local-ai"]
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    networks: [dra-network]
