[project]
name = "dra-backend"
version = "0.1.0"
description = "DeepResearch AI backend — FastAPI API, Celery workers, and the ai/ agent package (imported via PYTHONPATH, see docs/architecture.md)"
requires-python = ">=3.12"
readme = "../README.md"
license = { text = "MIT" }

dependencies = [
    # --- Web framework ---
    "fastapi>=0.139,<1.0",
    "uvicorn[standard]>=0.50,<1.0",
    "python-multipart>=0.0.32,<0.1",
    "slowapi>=0.1.10,<0.2",

    # --- Data / persistence ---
    "sqlalchemy>=2.0.51,<3.0",
    "alembic>=1.18,<2.0",
    "asyncpg>=0.31,<0.32",
    "psycopg2-binary>=2.9.12,<3.0",   # sync driver, used by Alembic migrations
    "pgvector>=0.4.2,<0.5",
    "pydantic>=2.13,<3.0",
    "pydantic-settings>=2.14,<3.0",

    # --- Async task processing ---
    "celery>=5.6.3,<6.0",
    "redis>=8.0,<9.0",

    # --- Auth ---
    "python-jose[cryptography]>=3.5,<4.0",
    # bcrypt used directly (not via passlib's CryptContext): passlib is
    # unmaintained and its bcrypt self-test breaks against bcrypt>=4.1's
    # stricter >72-byte handling — see app/core/security.py.
    "bcrypt>=5.0,<6.0",
    "authlib>=1.7.2,<2.0",            # OAuth (Google/GitHub)
    "itsdangerous>=2.2,<3.0",         # session cookie signing, required by Starlette's SessionMiddleware (OAuth state/nonce)
    "pydantic[email]>=2.13,<3.0",     # EmailStr validation on auth schemas

    # --- Object storage ---
    "boto3>=1.43,<2.0",               # S3-compatible client, used against MinIO

    # --- Observability ---
    "prometheus-fastapi-instrumentator>=8.0,<9.0",
    "structlog>=26.1,<27.0",

    # --- HTTP client (used by ai/tools/ search integrations and OAuth) ---
    "httpx>=0.28,<0.29",
    "tenacity>=9.1,<10.0",            # retry policy for external calls (search/tool/LLM APIs)

    # --- AI orchestration (ai/ package deps; installed here since ai/ is imported
    #     via PYTHONPATH into this same environment rather than pip-installed
    #     separately — see docs/architecture.md § dependency injection) ---
    "langgraph>=1.2.7,<2.0",
    "langchain>=1.3.11,<2.0",
    "langchain-openai>=1.3.3,<2.0",
    "langchain-anthropic>=1.4.8,<2.0",
    "langchain-community>=0.4.2,<0.5",
    "openai>=2.44,<3.0",
    "anthropic>=0.116,<0.117",
    "ollama>=0.6.2,<0.7",

    # --- Document loaders ---
    "pypdf>=6.14,<7.0",
    "python-docx>=1.2,<2.0",
    "markdown-it-py>=4.2,<5.0",
    "youtube-transcript-api>=1.2.4,<2.0",
    "beautifulsoup4>=4.14,<5.0",   # URL loader — proper HTML parsing, not ad-hoc regex

    # --- Search tools ---
    "arxiv>=4.0,<5.0",
    "ddgs>=9.14,<10.0",       # duckduckgo-search was renamed to ddgs upstream; same API
    "PyGithub>=2.9,<3.0",
    # Wikipedia's REST API needs no dedicated package — see httpx above.
]

[project.optional-dependencies]
# Local embedding/LLM path (BGE via sentence-transformers). Deliberately kept
# out of the base dependency set — only the worker image installs this extra
# (see docker/worker/Dockerfile) so the lean API image never pulls in torch.
local = [
    "sentence-transformers>=5.6,<6.0",
    "torch>=2.12,<3.0",
]

dev = [
    "pytest>=9.1,<10.0",
    "pytest-asyncio>=1.4,<2.0",
    "pytest-cov>=7.1,<8.0",
    "fakeredis>=2.31,<3.0",   # in-process Redis pub/sub, used by tests/integration/test_*.py
    "httpx2>=2.5,<3.0",   # starlette.testclient prefers this over httpx as of starlette 1.3
    "ruff>=0.15,<0.16",
    "mypy>=2.1,<3.0",
    "types-python-jose>=3.5,<4.0",
    "types-Authlib>=1.6,<2.0",
]

[build-system]
requires = ["hatchling>=1.30"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
# `ai` lives one directory up (repo_root/ai), imported the same way it is in
# the Docker images (PYTHONPATH=repo root) — see docker/backend/Dockerfile.
pythonpath = [".", ".."]
testpaths = ["tests", "../ai/tests"]
asyncio_mode = "auto"
# Session-scoped (not the default per-function) event loop: multiple
# integration test files each construct their own TestClient(app) against the
# same module-level app.state.container.db_engine (built once at import
# time). Under a fresh event loop per test function, an asyncpg connection
# pooled by one test's loop gets reused/closed by a later test's *different*
# loop, crashing with "Event loop is closed" during pool cleanup — caught by
# running the full suite together, not any single file in isolation.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)`/`Query(...)`/etc. in argument defaults is FastAPI's own
# recommended DI pattern (not the mutable-default-argument bug B008 exists
# to catch) — see https://fastapi.tiangolo.com/tutorial/dependencies/.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Security",
    "fastapi.Form",
    "fastapi.File",
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ".."

[[tool.mypy.overrides]]
# celery ships no py.typed marker / stubs (as of celery 5.6); this silences
# the resulting import-untyped noise without loosening strict mode elsewhere.
module = "celery.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# same story for pgvector (as of 0.4.x) — no py.typed marker.
module = "pgvector.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# same story for arxiv (as of 2.x) — no py.typed marker.
module = "arxiv.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# same story for boto3/botocore (no py.typed marker; boto3-stubs exists but
# is a large generated-per-service dependency not worth adding for one client).
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true
